<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="images/photo_2.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="images/photo_2.png"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Welcome - Quiz Application</title>

    <link
        rel="stylesheet"
        href="style1.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <nav class="top-nav">

        <div class="user-badge">

            <span class="user-icon">👤</span>

            <span id="userNameDisplay">
                Guest
            </span>

        </div>

    </nav>


    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>


    <main class="welcome-container">

        <!-- TOP 468x60 AD -->
        <section class="ad-section ad-banner-section">

            <div class="ad-label">
                <span></span>
                SPONSORED
            </div>

            <div class="ad-banner">

                <script>
                    atOptions = {
                        'key' : '8e1ad7ae01383aca7a40b343c04920e2',
                        'format' : 'iframe',
                        'height' : 60,
                        'width' : 468,
                        'params' : {}
                    };
                </script>

                <script
                    src="https://www.highrevenueformat.com/8e1ad7ae01383aca7a40b343c04920e2/invoke.js">
                </script>

            </div>

        </section>


        <!-- MAIN WELCOME CARD -->
        <div class="welcome-card">

            <div class="card-border-glow"></div>

            <div class="card-content">

                <span class="badge">

                    <span class="badge-dot"></span>

                    Brainloom

                </span>


                <div class="logo-wrapper">

                    <div class="logo-ring"></div>

                    <img
                        src="images/photo_2.png"
                        alt="Brainloom Logo"
                        class="brand-logo"
                    >

                </div>


                <h1 class="portal-title">
                    Quiz Application
                </h1>


                <p class="portal-subtitle">
                    Choose an option below to get started
                </p>


                <div class="options-grid">

                    <button
                        class="option-btn btn-create"
                        id="createQuizBtn"
                        type="button"
                    >

                        <span class="btn-icon">
                            ➕
                        </span>

                        <span
                            class="btn-text"
                            id="createQuizText"
                        >
                            Create Quiz
                        </span>

                    </button>


                    <button
                        class="option-btn btn-start"
                        id="startQuizBtn"
                        type="button"
                    >

                        <span class="btn-icon">
                            🚀
                        </span>

                        <span
                            class="btn-text"
                            id="startQuizText"
                        >
                            Start Quiz
                        </span>

                    </button>

                </div>

            </div>

        </div>


        <!-- BOTTOM 300x250 AD -->
        <section class="ad-section ad-square-section">

            <div class="ad-label">
                <span></span>
                SPONSORED
            </div>

            <div class="ad-square">

                <script>
                    atOptions = {
                        'key' : '7459ba9e82dc8885cf7814f79335e070',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                    };
                </script>

                <script
                    src="https://www.highrevenueformat.com/7459ba9e82dc8885cf7814f79335e070/invoke.js">
                </script>

            </div>

        </section>

    </main>


    <script src="script1.js"></script>

</body>
</html>
